name: CodeGuardian AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  codeguardian-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository structure
        run: |
          echo "Current Folder:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Backend files:"
          ls -la backend
          echo "Backend agents:"
          ls -la backend/agents
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn openai gitpython pydantic requests

      - name: Start CodeGuardian API
        run: |
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../server.log 2>&1 &
          sleep 10
          cd ..
          echo "server log:"
          cat server.log
          
      - name: Verify CodeGuardian API is running
        run: |
          curl --fail --show-error http://127.0.0.1:8000/docs
          echo "CodeGuardian API is running successfully"

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "PR diff generated"
          wc -l pr_diff.txt
          head -50 pr_diff.txt

      - name: Create Payload
        run: |
          python - << 'EOF'
          import json

          with open("pr_diff.txt", "r", encoding="utf-8", errors="ignore") as f:
              diff = f.read()

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump({"diff": diff}, f)

          print("Payload created successfully")
          EOF

      - name: Run CodeGuardian Review
        run: |
          curl --fail --show-error --silent -X POST http://127.0.0.1:8000/review \
            -H "Content-Type: application/json" \
            --data @payload.json \
            -o review_result.json

          echo "Review result:"
          cat review_result.json
          
      - name: Create Review Comment
        run: |
          python - << 'EOF'
          import json

          with open("review_result.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          security = data.get("security", [])
          quality = data.get("quality", [])
          defects = data.get("defects", [])
          tests = data.get("tests", [])
          risk = data.get("risk", 0)

          def section(title, items):
              if items:
                  return "## " + title + "\n" + "\n".join(["- " + str(x) for x in items])
              return "## " + title + "\n- No findings."

          comment = "# CodeGuardian AI Review\n\n"
          comment += f"**Risk Score:**{risk}\n\n"
          comment += section("Security Findings", security) + "\n\n"
          comment += section("Quality Findings", quality) + "\n\n"
          comment += section("Historical Defect Matches", defects) + "\n\n"
          comment += section("Suggested Tests", tests) + "\n\n"
          comment += "---\nGenerated automatically by CodeGuardian AI."
          
          with open("review_comment.md", "w", encoding="utf-8") as f:
              f.write(comment)

          print(comment)
          EOF

      - name: Post Comment To Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
           gh pr comment ${{ github.event.pull_request.number }} --body-file review_comment.md
